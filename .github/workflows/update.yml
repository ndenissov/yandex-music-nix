name: Auto Update

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run update script
        run: ./update.sh

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yandex-music/linux.nix yandex-music/darwin.nix
          if ! git diff --cached --quiet; then
            VERSION=$(grep -oP 'version = "\K[^"]+' yandex-music/linux.nix | head -n 1)
            git commit -m "chore: update Yandex Music to $VERSION"
            git push origin main
            git tag -f "v$VERSION"
            git push -f origin "v$VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update Release
        if: steps.commit.outputs.updated == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.commit.outputs.version }}
          name: Yandex Music v${{ steps.commit.outputs.version }}
          body: "Automated release for Yandex Music version ${{ steps.commit.outputs.version }}."
          generate_release_notes: false

