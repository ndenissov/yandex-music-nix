name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -oP 'version = "\K[^"]+' yandex-music/linux.nix | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v${{ steps.get_version.outputs.version }}
          git push -f origin v${{ steps.get_version.outputs.version }}

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Yandex Music v${{ steps.get_version.outputs.version }}
          body: "Automated release for Yandex Music version ${{ steps.get_version.outputs.version }}."
          generate_release_notes: false
